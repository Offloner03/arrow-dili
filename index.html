<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dlicom Arrow Jam</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 0;
      background: #0f172a; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }

    .watermark-bg {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background-image: url('bg-logo.png'); 
      background-repeat: repeat; 
      background-size: 500px; 
      transform: rotate(-25deg); 
      opacity: 0.05; 
      pointer-events: none; 
      z-index: -1; 
    }

    #game-container { width: 360px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 5; }
    
    .header {
      width: 100%; display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 15px; padding: 0 10px;
    }
    
    .level-text { font-size: 24px; font-weight: 800; color: #ffffff; white-space: nowrap; }
    .timer-bar {
      flex: 1; height: 8px; background: #334155;
      border-radius: 4px; margin: 0 15px; overflow: hidden;
    }
    .timer-fill { height: 100%; width: 100%; background: #f59e0b; transition: width 0.1s linear; }
    .timer-text { font-weight: 700; color: #e2e8f0; font-size: 16px; width: 45px; text-align: right; }
    
    #board {
      width: 350px; height: 350px;
      position: relative; 
      background: transparent; 
      border-radius: 16px; 
      box-shadow: none; 
      overflow: hidden;
    }

    #board::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 350px; 
      height: 350px;
      background-image: url('logo.png'); 
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.6;
      pointer-events: none;
      z-index: 0;
    }

    .arrow {
      position: absolute; width: 50px; height: 50px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.25s ease-out, opacity 0.25s ease-out;
      z-index: 1; 
    }
    .arrow svg { width: 90%; height: 90%; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.4)); }
    .blocked { animation: shake 0.3s ease-in-out; }
    
    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-4px, -4px); }
      40% { transform: translate(4px, 4px); }
      60% { transform: translate(-4px, 4px); }
      80% { transform: translate(4px, -2px); }
    }
    
    #overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85);
      display: none; flex-direction: column; align-items: center;
      justify-content: center; color: #fff; z-index: 10; border-radius: 16px;
    }
    #overlay h2 { margin: 0 0 10px 0; font-size: 28px; text-align: center; }
    #action-btn {
      padding: 10px 24px; background: #3b82f6; border: none; color: white;
      font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px;
    }
    .penalty-text {
      position: absolute; color: #ef4444; font-weight: bold; font-size: 24px;
      pointer-events: none; animation: floatUp 0.6s ease-out forwards; z-index: 20;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-30px) scale(1.5); }
    }
  </style>
</head>
<body>

  <div class="watermark-bg"></div>

  <div id="game-container">
    <div class="header">
      <img src="logo.png" alt="Dlicom" style="height: 24px; margin-right: 10px;">
      <div class="level-text" id="level-label">Level 1</div>
      <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
      <div class="timer-text" id="timer-label">15.0s</div>
    </div>
    
    <div id="board">
      <div id="overlay">
        <h2 id="overlay-msg">Level Clear! 🎉</h2>
        <button id="action-btn" onclick="handleOverlayClick()">Next Level</button>
      </div>
    </div>
  </div>

  <script>
    const CELL_SIZE = 50; 
    const GRID_COLS = 7;
    const GRID_ROWS = 7;
    const COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
    
    const board = document.getElementById('board');
    const timerFill = document.getElementById('timer-fill');
    const timerLabel = document.getElementById('timer-label');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const actionBtn = document.getElementById('action-btn');
    const levelLabel = document.getElementById('level-label');

    let currentLevel = 1;
    let arrows = [];
    let timeLeft = 0;
    let maxTime = 0;
    let timerInterval = null;
    let isGameOver = false;
    let hasWon = false;

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playErrorSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    function playLevelUpSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
      osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }

    function playGameOverSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth'; 
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.8);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.8);
    }

    // ALGORITMA BARU: CLUMPING DARI TENGAH + INTERLOCKING (SALING NGUNCI)
    function generateLevel(levelIdx) {
      // Makin tinggi level, makin penuh
      let numArrows = Math.min(3 + Math.floor(levelIdx * 2), 49); 
      // Waktu mepet: cuma dapet 0.85 detik per panah
      let timeLimit = Math.max(6, Math.ceil(numArrows * 0.85)); 
      
      let newArrows = [];
      const dirs = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
      
      for (let i = 0; i < numArrows; i++) {
        let candidates = [];
        let candidateCells = [];
        
        // 1. CARI SEL YANG BERSEBELAHAN DARI TENGAH (CLUMPING)
        if (newArrows.length === 0) {
          candidateCells.push({x: Math.floor(GRID_COLS/2), y: Math.floor(GRID_ROWS/2)});
        } else {
          for (let x = 0; x < GRID_COLS; x++) {
            for (let y = 0; y < GRID_ROWS; y++) {
              if (!newArrows.some(a => a.x === x && a.y === y)) {
                let isAdjacent = newArrows.some(a => 
                  (Math.abs(a.x - x) === 1 && a.y === y) || 
                  (Math.abs(a.y - y) === 1 && a.x === x)
                );
                if (isAdjacent) candidateCells.push({x, y});
              }
            }
          }
        }
        
        // 2. CEK ARAH DI SEL CLUMPING & HITUNG SKOR BLOCKING
        for (let cell of candidateCells) {
          for (let dir of dirs) {
            // Syarat utama: Panah BARU ini nggak boleh nabrak (di depannya harus kosong dari panah yg udah ada)
            let hit = newArrows.some(other => {
              if (dir === 'UP') return other.x === cell.x && other.y < cell.y;
              if (dir === 'DOWN') return other.x === cell.x && other.y > cell.y;
              if (dir === 'LEFT') return other.y === cell.y && other.x < cell.x;
              if (dir === 'RIGHT') return other.y === cell.y && other.x > cell.x;
              return false;
            });
            
            if (!hit) {
              // Kalau aman, kita hitung seberapa nyebelin panah ini (seberapa banyak dia ngunci panah yg lama)
              let blockScore = 0;
              newArrows.forEach(other => {
                if (other.dir === 'UP' && other.x === cell.x && cell.y < other.y) blockScore++;
                if (other.dir === 'DOWN' && other.x === cell.x && cell.y > other.y) blockScore++;
                if (other.dir === 'LEFT' && other.y === cell.y && cell.x < other.x) blockScore++;
                if (other.dir === 'RIGHT' && other.y === cell.y && cell.x > other.x) blockScore++;
              });
              candidates.push({x: cell.x, y: cell.y, dir: dir, blockScore: blockScore});
            }
          }
        }
        
        // 3. FALLBACK: Kalau area nempel udah buntu arah keluarnya, baru cari spot random
        if (candidates.length === 0) {
          for (let x = 0; x < GRID_COLS; x++) {
            for (let y = 0; y < GRID_ROWS; y++) {
              if (!newArrows.some(a => a.x === x && a.y === y)) {
                for (let dir of dirs) {
                  let hit = newArrows.some(other => {
                    if (dir === 'UP') return other.x === x && other.y < y;
                    if (dir === 'DOWN') return other.x === x && other.y > y;
                    if (dir === 'LEFT') return other.y === y && other.x < x;
                    if (dir === 'RIGHT') return other.y === y && other.x > x;
                    return false;
                  });
                  if (!hit) {
                    let blockScore = 0;
                    newArrows.forEach(other => {
                      if (other.dir === 'UP' && other.x === x && y < other.y) blockScore++;
                      if (other.dir === 'DOWN' && other.x === x && y > other.y) blockScore++;
                      if (other.dir === 'LEFT' && other.y === y && x < other.x) blockScore++;
                      if (other.dir === 'RIGHT' && other.y === y && x > other.x) blockScore++;
                    });
                    candidates.push({x, y, dir, blockScore});
                  }
                }
              }
            }
          }
        }
        
        if (candidates.length === 0) break; 
        
        // 4. SELALU PILIH PANAH YANG SKOR BLOCKINGNYA PALING TINGGI
        candidates.sort((a, b) => b.blockScore - a.blockScore);
        let bestScore = candidates[0].blockScore;
        let bestCandidates = candidates.filter(c => c.blockScore === bestScore);
        let chosen = bestCandidates[Math.floor(Math.random() * bestCandidates.length)];
        
        newArrows.push({
          id: i + 1, x: chosen.x, y: chosen.y, dir: chosen.dir,
          color: COLORS[Math.floor(Math.random() * COLORS.length)]
        });
      }
      return { time: timeLimit, arrows: newArrows };
    }

    function getRotation(dir) {
      switch (dir) { case 'UP': return 0; case 'RIGHT': return 90; case 'DOWN': return 180; case 'LEFT': return 270; }
    }

    function initLevel(lvlIdx) {
      clearInterval(timerInterval);
      board.querySelectorAll('.arrow').forEach(el => el.remove());
      board.querySelectorAll('.penalty-text').forEach(el => el.remove());
      overlay.style.display = 'none';
      isGameOver = false;
      hasWon = false;

      levelLabel.innerText = `Level ${lvlIdx}`;
      const lvlData = generateLevel(lvlIdx);
      
      maxTime = lvlData.time;
      timeLeft = lvlData.time;
      arrows = lvlData.arrows;

      arrows.forEach(arr => {
        const el = document.createElement('div');
        el.className = 'arrow';
        el.id = `arrow-${arr.id}`;
        el.style.left = `${arr.x * CELL_SIZE}px`;
        el.style.top = `${arr.y * CELL_SIZE}px`;
        
        const deg = getRotation(arr.dir);
        el.innerHTML = `
          <svg viewBox="0 0 100 100" style="transform: rotate(${deg}deg);">
            <path fill="${arr.color}" d="M50 5 L90 45 L65 45 L65 95 L35 95 L35 45 L10 45 Z"/>
          </svg>`;
        
        el.addEventListener('click', (e) => tryMoveArrow(arr.id, e));
        el.addEventListener('touchstart', (e) => {
          e.preventDefault(); 
          tryMoveArrow(arr.id, e.touches[0]);
        }, {passive: false});

        board.appendChild(el);
      });

      startTimer();
    }

    function startTimer() {
      updateTimerUI();
      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        if (timeLeft <= 0) { timeLeft = 0; endGame(false); }
        updateTimerUI();
      }, 100);
    }

    function updateTimerUI() {
      timerLabel.innerText = `${Math.max(0, timeLeft).toFixed(1)}s`; 
      const pct = (timeLeft / maxTime) * 100;
      timerFill.style.width = `${pct}%`;
      timerFill.style.background = pct < 30 ? '#ef4444' : '#f59e0b';
    }

    function tryMoveArrow(id, event) {
      if (isGameOver) return;
      const target = arrows.find(a => a.id === id);
      if (!target) return;

      if (audioCtx.state === 'suspended') audioCtx.resume();

      const el = document.getElementById(`arrow-${id}`);
      
      const blocked = arrows.some(other => {
        if (other.id === target.id) return false;
        if (target.dir === 'UP') return other.x === target.x && other.y < target.y;
        if (target.dir === 'DOWN') return other.x === target.x && other.y > target.y;
        if (target.dir === 'LEFT') return other.y === target.y && other.x < target.x;
        if (target.dir === 'RIGHT') return other.y === target.y && other.x > target.x;
        return false;
      });

      if (blocked) {
        el.classList.remove('blocked');
        void el.offsetWidth; 
        el.classList.add('blocked');

        playErrorSound(); 
        timeLeft -= 1;
        
        const xPos = event.clientX || event.pageX;
        const yPos = event.clientY || event.pageY;
        if (xPos && yPos) showPenaltyText(xPos, yPos);

        if (timeLeft <= 0) {
          timeLeft = 0;
          updateTimerUI();
          endGame(false);
        } else {
          updateTimerUI();
        }
        return;
      }

      let destX = target.x * CELL_SIZE;
      let destY = target.y * CELL_SIZE;

      if (target.dir === 'UP') destY = -100;
      if (target.dir === 'DOWN') destY = 450;
      if (target.dir === 'LEFT') destX = -100;
      if (target.dir === 'RIGHT') destX = 450;

      el.style.transform = `translate(${destX - target.x * CELL_SIZE}px, ${destY - target.y * CELL_SIZE}px)`;
      el.style.opacity = '0';

      arrows = arrows.filter(a => a.id !== id);

      setTimeout(() => {
        el.remove();
        if (arrows.length === 0 && !isGameOver) { 
          playLevelUpSound(); 
          endGame(true); 
        }
      }, 250);
    }

    function showPenaltyText(x, y) {
      const penaltyEl = document.createElement('div');
      penaltyEl.className = 'penalty-text';
      penaltyEl.innerText = '-1s';
      
      const boardRect = board.getBoundingClientRect();
      penaltyEl.style.left = `${x - boardRect.left - 20}px`;
      penaltyEl.style.top = `${y - boardRect.top - 20}px`;
      
      board.appendChild(penaltyEl);
      setTimeout(() => penaltyEl.remove(), 600);
    }

    function endGame(won) {
      isGameOver = true; hasWon = won;
      clearInterval(timerInterval);
      overlay.style.display = 'flex';
      
      if (won) {
        overlayMsg.innerText = 'Level Clear! 🎉';
        actionBtn.innerText = 'Next Level';
      } else {
        overlayMsg.innerText = 'Game Over! ⏰';
        actionBtn.innerText = 'Try Again';
        playGameOverSound();
      }
    }

    function handleOverlayClick() {
      if (hasWon) {
        currentLevel++;
      } else {
        currentLevel = 1;
      }
      initLevel(currentLevel);
    }

    initLevel(currentLevel);
  </script>
</body>
</html>
