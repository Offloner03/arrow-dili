<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrow Clear Puzzle</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 0;
      background: #f4f8fb;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    #game-container { width: 360px; display: flex; flex-direction: column; align-items: center; }
    
    .header {
      width: 100%; display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 15px; padding: 0 10px;
    }
    .level-text { font-size: 24px; font-weight: 800; color: #24334a; white-space: nowrap; }
    .timer-bar {
      flex: 1; height: 8px; background: #e2e8f0;
      border-radius: 4px; margin: 0 15px; overflow: hidden;
    }
    .timer-fill { height: 100%; width: 100%; background: #f59e0b; transition: width 0.1s linear; }
    .timer-text { font-weight: 700; color: #475569; font-size: 16px; width: 40px; text-align: right; }
    
    #board {
      width: 350px; height: 350px;
      position: relative; background: #ffffff;
      border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }
    
    /* Watermark Logo di tengah board */
    #board::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      background-image: url('logo.png'); /* Pastikan file bernama logo.png */
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }

    .arrow {
      position: absolute; width: 50px; height: 50px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.25s ease-out, opacity 0.25s ease-out;
      z-index: 1; /* Supaya panah berada di atas watermark */
    }
    .arrow svg { width: 90%; height: 90%; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2)); }
    .blocked { animation: shake 0.3s ease-in-out; }
    
    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-4px, -4px); }
      40% { transform: translate(4px, 4px); }
      60% { transform: translate(-4px, 4px); }
      80% { transform: translate(4px, -2px); }
    }
    
    #overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85);
      display: none; flex-direction: column; align-items: center;
      justify-content: center; color: #fff; z-index: 10; border-radius: 16px;
    }
    #overlay h2 { margin: 0 0 10px 0; font-size: 28px; }
    #action-btn {
      padding: 10px 24px; background: #3b82f6; border: none; color: white;
      font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="header">
      <!-- Logo di Header -->
      <img src="logo.png" alt="Dlicom" style="height: 24px; margin-right: 10px;">
      
      <div class="level-text" id="level-label">Level 1</div>
      <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
      <div class="timer-text" id="timer-label">15s</div>
    </div>
    
    <div id="board">
      <div id="overlay">
        <h2 id="overlay-msg">Level Clear! 🎉</h2>
        <button id="action-btn" onclick="handleOverlayClick()">Next Level</button>
      </div>
    </div>
  </div>

  <script>
    const CELL_SIZE = 50; 
    const GRID_COLS = 7;
    const GRID_ROWS = 7;
    const COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
    
    const board = document.getElementById('board');
    const timerFill = document.getElementById('timer-fill');
    const timerLabel = document.getElementById('timer-label');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const actionBtn = document.getElementById('action-btn');
    const levelLabel = document.getElementById('level-label');

    let currentLevel = 1;
    let arrows = [];
    let timeLeft = 0;
    let maxTime = 0;
    let timerInterval = null;
    let isGameOver = false;
    let hasWon = false;

    function generateLevel(levelIdx) {
      let numArrows = Math.min(3 + Math.floor(levelIdx * 1.5), 45);
      let timeLimit = Math.max(10, Math.floor(numArrows * 1.5)); 
      
      let newArrows = [];
      
      for (let i = 0; i < numArrows; i++) {
        let emptyCells = [];
        for (let x = 0; x < GRID_COLS; x++) {
          for (let y = 0; y < GRID_ROWS; y++) {
            if (!newArrows.some(a => a.x === x && a.y === y)) {
              emptyCells.push({x, y});
            }
          }
        }
        
        emptyCells.sort(() => Math.random() - 0.5);
        
        let placed = false;
        for (let cell of emptyCells) {
          let dirs = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
          dirs.sort(() => Math.random() - 0.5); 
          
          for (let dir of dirs) {
            let hit = newArrows.some(other => {
              if (dir === 'UP') return other.x === cell.x && other.y < cell.y;
              if (dir === 'DOWN') return other.x === cell.x && other.y > cell.y;
              if (dir === 'LEFT') return other.y === cell.y && other.x < cell.x;
              if (dir === 'RIGHT') return other.y === cell.y && other.x > cell.x;
              return false;
            });
            
            if (!hit) {
              newArrows.push({
                id: i + 1, x: cell.x, y: cell.y, dir: dir,
                color: COLORS[Math.floor(Math.random() * COLORS.length)]
              });
              placed = true;
              break;
            }
          }
          if (placed) break;
        }
      }
      return { time: timeLimit, arrows: newArrows };
    }

    function getRotation(dir) {
      switch (dir) { case 'UP': return 0; case 'RIGHT': return 90; case 'DOWN': return 180; case 'LEFT': return 270; }
    }

    function initLevel(lvlIdx) {
      clearInterval(timerInterval);
      board.querySelectorAll('.arrow').forEach(el => el.remove());
      overlay.style.display = 'none';
      isGameOver = false;
      hasWon = false;

      levelLabel.innerText = `Level ${lvlIdx}`;
      const lvlData = generateLevel(lvlIdx);
      
      maxTime = lvlData.time;
      timeLeft = lvlData.time;
      arrows = lvlData.arrows;

      arrows.forEach(arr => {
        const el = document.createElement('div');
        el.className = 'arrow';
        el.id = `arrow-${arr.id}`;
        el.style.left = `${arr.x * CELL_SIZE}px`;
        el.style.top = `${arr.y * CELL_SIZE}px`;
        
        const deg = getRotation(arr.dir);
        el.innerHTML = `
          <svg viewBox="0 0 100 100" style="transform: rotate(${deg}deg);">
            <path fill="${arr.color}" d="M50 5 L90 45 L65 45 L65 95 L35 95 L35 45 L10 45 Z"/>
          </svg>`;
        el.addEventListener('click', () => tryMoveArrow(arr.id));
        board.appendChild(el);
      });

      startTimer();
    }

    function startTimer() {
      updateTimerUI();
      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        if (timeLeft <= 0) { timeLeft = 0; endGame(false); }
        updateTimerUI();
      }, 100);
    }

    function updateTimerUI() {
      timerLabel.innerText = `${Math.ceil(timeLeft)}s`;
      const pct = (timeLeft / maxTime) * 100;
      timerFill.style.width = `${pct}%`;
      timerFill.style.background = pct < 30 ? '#ef4444' : '#f59e0b';
    }

    function tryMoveArrow(id) {
      if (isGameOver) return;
      const target = arrows.find(a => a.id === id);
      if (!target) return;

      const el = document.getElementById(`arrow-${id}`);
      
      const blocked = arrows.some(other => {
        if (other.id === target.id) return false;
        if (target.dir === 'UP') return other.x === target.x && other.y < target.y;
        if (target.dir === 'DOWN') return other.x === target.x && other.y > target.y;
        if (target.dir === 'LEFT') return other.y === target.y && other.x < target.x;
        if (target.dir === 'RIGHT') return other.y === target.y && other.x > target.x;
        return false;
      });

      if (blocked) {
        el.classList.remove('blocked');
        void el.offsetWidth; 
        el.classList.add('blocked');
        return;
      }

      let destX = target.x * CELL_SIZE;
      let destY = target.y * CELL_SIZE;

      if (target.dir === 'UP') destY = -100;
      if (target.dir === 'DOWN') destY = 450;
      if (target.dir === 'LEFT') destX = -100;
      if (target.dir === 'RIGHT') destX = 450;

      el.style.transform = `translate(${destX - target.x * CELL_SIZE}px, ${destY - target.y * CELL_SIZE}px)`;
      el.style.opacity = '0';

      arrows = arrows.filter(a => a.id !== id);

      setTimeout(() => {
        el.remove();
        if (arrows.length === 0 && !isGameOver) { endGame(true); }
      }, 250);
    }

    function endGame(won) {
      isGameOver = true; hasWon = won;
      clearInterval(timerInterval);
      overlay.style.display = 'flex';
      overlayMsg.innerText = won ? 'Level Clear! 🎉' : 'Time Out! ⏰';
      actionBtn.innerText = won ? 'Next Level' : 'Try Again';
    }

    function handleOverlayClick() {
      if (hasWon) currentLevel++;
      initLevel(currentLevel);
    }

    initLevel(currentLevel);
  </script>
</body>
</html>
